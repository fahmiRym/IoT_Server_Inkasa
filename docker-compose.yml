version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: noc-dashboard-app

    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: noc_dashboard
      DB_USERNAME: noc_user
      DB_PASSWORD: alhamdulillah

    volumes:
      - ./.env:/var/www/.env
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
      - ./app/Providers/AppServiceProvider.php:/var/www/app/Providers/AppServiceProvider.php
      - ./bootstrap/app.php:/var/www/bootstrap/app.php

    depends_on:
      db:
        condition: service_healthy

    networks:
      - noc-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.0

    container_name: noc-dashboard-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: alhamdulillah
      MYSQL_DATABASE: noc_dashboard
      MYSQL_USER: noc_user
      MYSQL_PASSWORD: alhamdulillah

    command: --default-authentication-plugin=mysql_native_password

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - noc-network

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine

    container_name: noc-dashboard-nginx

    restart: unless-stopped

    # agar nginx bisa proxy ke mediamtx (HLS :8888) yang jalan di host network
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "80:80"

    volumes:
      - ./public:/var/www/public
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - noc-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg

    container_name: noc-dashboard-mediamtx

    restart: unless-stopped

    network_mode: host

    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:latest

    container_name: noc-dashboard-tunnel

    restart: unless-stopped

    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}

    depends_on:
      - nginx

    networks:
      - noc-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  motion-detector:
    build:
      context: ./motion-detector
      dockerfile: Dockerfile

    container_name: noc-dashboard-motion

    restart: unless-stopped

    # host network: bisa akses mediamtx (127.0.0.1:8554) & jaringan kamera
    network_mode: host

    environment:
      TZ: "${TZ:-Asia/Jakarta}"
      RTSP_URL: "${CCTV_RTSP_URL:-rtsp://127.0.0.1:8554/cctv1}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      LOCATION_LABEL: "${CCTV_LABEL:-Ruang Server}"
      MIN_AREA: "${MOTION_MIN_AREA:-1500}"
      CONSEC_FRAMES: "${MOTION_CONSEC:-3}"
      COOLDOWN_SECONDS: "${MOTION_COOLDOWN:-60}"
      RECORD_SECONDS: "${MOTION_RECORD_SECS:-8}"
      YOLO_CONF: "${YOLO_CONF:-0.4}"
      ALERT_ONLY_PERSON: "${ALERT_ONLY_PERSON:-false}"
      CAPTURE_DIR: "/captures"

    volumes:
      - ./storage/app/motion:/captures

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  noc-network:
    driver: bridge

volumes:
  db_data:
