webrtc: yes
webrtcAddress: :8889

hls: yes
hlsAddress: :8888
hlsVariant: mpegts
hlsAllowOrigin: '*'

paths:
  cctv1:
    source: rtsp://admin:Rahasiadong%40@192.168.99.253:554/h264/ch1/sub/av_stream
    rtspTransport: tcp

  # cctv2 (.252): sub-stream kamera = H265 (tak didukung WebRTC & kelebar utk HLS mobile).
  # Transcode on-demand H265 -> H264 720p-an supaya tampil di semua device.
  cctv2:
    runOnDemand: ffmpeg -nostdin -rtsp_transport tcp -i rtsp://admin:Rahasiadong%40@192.168.99.252:554/Streaming/Channels/102 -vf scale=1280:-2 -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -pix_fmt yuv420p -g 25 -an -f rtsp rtsp://localhost:8554/cctv2
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 30s
