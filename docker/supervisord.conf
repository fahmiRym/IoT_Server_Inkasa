[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5

[program:laravel-schedule]
; schedule:work = scheduler Laravel yang benar (cek task tiap menit, jalan terus).
; Sebelumnya 'schedule:run' + autorestart bikin loop sensor:fetch jalan non-stop.
command=php /var/www/artisan schedule:work
stdout_logfile=/var/log/supervisor/laravel-schedule.log
stderr_logfile=/var/log/supervisor/laravel-schedule-error.log
autostart=true
autorestart=true
priority=10
numprocs=1
process_name=%(program_name)s_%(process_num)02d
user=www-data

; [DIHAPUS] program:sensor-live -- penguras kuota Blynk (polling tiap 1.5 dtk).
; Perekaman sensor kini lewat ESP32 push langsung ke POST /api/sensor/store
; (lihat docs/LOG-BLYNK-QUOTA.md). Jangan diaktifkan lagi.
