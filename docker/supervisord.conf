[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5

[program:laravel-schedule]
command=php /var/www/artisan schedule:run
stdout_logfile=/var/log/supervisor/laravel-schedule.log
stderr_logfile=/var/log/supervisor/laravel-schedule-error.log
autostart=true
autorestart=true
priority=10
numprocs=1
process_name=%(program_name)s_%(process_num)02d
user=www-data
; Run every minute
[program:sensor-live]
command=php /var/www/artisan sensor:live
stdout_logfile=/var/log/supervisor/sensor-live.log
stderr_logfile=/var/log/supervisor/sensor-live-error.log
autostart=true
autorestart=true
user=www-data
priority=20
