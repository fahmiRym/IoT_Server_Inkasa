server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;

        # Timeout settings to prevent 504 Gateway Time-out
        fastcgi_read_timeout 600;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    location ~ /\.ht {
        deny all;
    }

    location /storage {
        alias /var/www/storage/app/public;
        add_header Cache-Control "public, immutable";
    }

    location /build {
        alias /var/www/public/build;
        add_header Cache-Control "public, immutable";
    }

    # Proxy HLS CCTV ke mediamtx (host network :8888) -> tampil andal di HP/tablet via domain utama
    location /cctv-hls/ {
        proxy_pass http://host.docker.internal:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # mediamtx HLS redirect 302 ke /<path> (cookieCheck) -> tambahkan prefix /cctv-hls/
        proxy_redirect ~^/(.*)$ /cctv-hls/$1;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
